[project]
name = "shipping-wasp"
version = "0.1.0"
description = "Wind-Assisted Ship Propulsion Benefit Prediction & Low-Carbon Route Adaptation Decision System"
requires-python = ">=3.11"
dependencies = [
    "xarray>=2026.7.0",
    "netCDF4>=1.7.4",
    "numpy>=1.26.4",
    "pandas>=2.3.3",
    "scipy>=1.13.1",
    "matplotlib>=3.9.4",
    "folium>=0.20.0",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = ["pytest>=7.0", "pytest-cov"]
viz = ["seaborn>=0.13", "cartopy>=0.22"]
app = ["streamlit>=1.36", "plotly>=5.22", "pydeck>=0.9"]
api = ["fastapi>=0.110", "uvicorn[standard]>=0.29", "httpx>=0.27"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]