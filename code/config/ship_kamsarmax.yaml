# Kamsarmax 散货船船型参数（82000 DWT）
# 定位: 面向散货船东的 WASP 选型算例基准船之一
# 主尺度来源: Norsepower 官方数据表参考船 (DWT 82000 / LOA 229m / 3×24×4 帆 / 7000kW / 14kn)
#            见 refs/Norsepower数据表_可用数据提取与交叉验证.md 第 21 行
# 水动力系数: 按 Kamsarmax 级散货船公开典型值填写（满载工况），量级用于改装前上游筛选，
#            非逐参数实测；与 KVLCC2 采用同一 Holtrop 简化口径（A_BT=0, C_stern=0）。

principal_dimensions:
  L: 225.0          # 垂线间长 (m), 由 LOA 229m 按 Kamsarmax 典型 LOA/Lpp≈1.02 折算
  B: 32.26          # 型宽 (m), Kamsarmax 标准型宽（Port Kamsar 限制）
  d: 14.45          # 设计吃水 (m), Kamsarmax 满载/结构吃水典型值
  V_disp: 89700.0   # 排水体积 (m³) = L·B·d·C_B ≈ 排水量 91.9kt/1.025，与 82kt DWT+自重相符
  C_B: 0.855        # 方形系数, 散货船满载典型 0.85-0.87
  D: 7.0            # 螺旋桨直径 (m), 大型散货船典型
  S_rudder: 45.0    # 舵面积 (m²)
  x_G: 0.0          # 重心纵向位置 (m, 相对舯)

hydrostatic_coefficients:
  C_M: 0.9950       # 舯剖面系数, 散货船满型舯剖面典型
  C_P: 0.8593       # 棱形系数 = C_B/C_M = 0.855/0.995
  C_WP: 0.9033      # 水线面系数, 经验式 (1+2·C_B)/3
  lcb: 2.50         # 浮心纵向位置 (%L, 舯前为正), 散货船满载 LCB 前移典型 +2~+3%

bow_and_stern:
  A_BT: 0.0         # 球鼻艏横截面积 (m²), 同 KVLCC2 简化口径（不计球鼻艏减阻）
  h_B: 0.0          # 球鼻艏高度 (m)
  C_stern: 0.0      # 尾型参数 (0=V型尾)

appendages:
  S_app: 50.6       # 附体湿面积 (m²), 舵双面湿面积估算 (≈舵面积×1.125)
  k2_eq: 1.3        # 附体阻力系数等价 (舵典型值)

operational:
  DWT: 82000.0      # 载重吨 (t), Norsepower 数据表参考值
  V_design_kn: 14.0 # 设计航速 (kn), Norsepower 数据表服务航速
  V_design_ms: 7.20 # 设计航速 (m/s) = 14 × 0.5144
  ship_type_imo: "bulk_carrier"  # IMO 船型 (用于 CII 参考线, cii.py SHIP_TYPE_CII_PARAMS)

wind_resistance:
  A_T: 750.0        # 横剖面受风面积 (m²), 按尺度自 KVLCC2 缩放
  A_L: 3200.0       # 侧向受风面积 (m²), 按尺度自 KVLCC2 缩放
  C_X_head: 0.90    # 顶风阻力系数
  C_X_cross: 1.20   # 横风阻力系数
  C_X_tail: 0.50    # 顺风阻力系数

seawater:
  rho_sw: 1025.0    # 海水密度 (kg/m³)
  nu_sw: 1.19e-6    # 海水运动粘度 (m²/s, 15°C)
