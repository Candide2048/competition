# PCTC 汽车滚装船船型参数（Pure Car & Truck Carrier, 车辆运输船）
# 定位: 面向 PCTC 船东的 WASP 选型算例船 —— WASP 头号招牌船型
#       (Wallenius Wilhelmsen Oceanbird / Orcelle Wind 均为 PCTC 风帆旗舰)。
#
# ⚠️ 重要边界声明（估算，非基准船）:
#   PCTC 无 SIMMAN/Gothenburg 级公开水动力基准船（不同于 KVLCC2/KCS）。
#   本文件主尺度取当代典型 6000-7000 车位 PCTC 量级（约 200m LOA），
#   水动力系数为工程估算：C_M 取箱型肥大船典型值，C_P=C_B/C_M，
#   C_WP=(1+2·C_B)/3 经验式，与其它船型 YAML 同一 Holtrop 简化口径
#   (A_BT=0, C_stern=0)。数量级用于筛选与横向对比，非单船精确值。
#   风阻迎风面 (A_T/A_L) 取 PCTC 高干舷大箱体量级，显著大于常规货船。

principal_dimensions:
  L: 199.0          # 垂线间长 Lpp (m), 典型 6500 车位 PCTC 约 LOA 200m
  B: 35.4           # 型宽 (m), 巴拿马新船闸上限附近
  d: 10.0           # 设计吃水 (m), PCTC 吃水浅（高干舷、轻货）
  V_disp: 40858.7   # 排水体积 (m³) = L·B·d·C_B = 199×35.4×10.0×0.58
  C_B: 0.58         # 方形系数, PCTC 中等肥瘦（估算，箱型船体但艏部瘦削）
  D: 6.5            # 螺旋桨直径 (m), 单桨估算
  S_rudder: 42.0    # 舵面积 (m²), 按尺度估算
  x_G: 0.0          # 重心纵向位置 (m, 相对舯), 阻力用 lcb，此处置 0

hydrostatic_coefficients:
  C_M: 0.97         # 舯剖面系数, 肥大箱型船体典型值（估算）
  C_P: 0.5979       # 棱形系数 = C_B/C_M = 0.58/0.97
  C_WP: 0.72        # 水线面系数 = (1+2·C_B)/3 = (1+1.16)/3（经验式）
  lcb: -1.0         # 浮心纵向位置 (%L, 舯前为正), 取小值（估算）

bow_and_stern:
  A_BT: 0.0         # 球鼻艏横截面积 (m²), 同 KVLCC2/KCS 简化口径（不计球鼻艏减阻）
  h_B: 0.0          # 球鼻艏高度 (m)
  C_stern: 0.0      # 尾型参数 (0=V型尾)

appendages:
  S_app: 47.0       # 附体湿面积 (m²), 舵双面湿面积估算 (≈舵面积×1.125)
  k2_eq: 1.3        # 附体阻力系数等价 (舵典型值)

operational:
  DWT: 18000.0      # 载重吨 (t), PCTC 载轻货 DWT 小（车辆密度低）
  GT: 62000.0       # 总吨 (GT), PCTC CII 参考线的容量基数（roro_cargo_vehicle 用 GT 非 DWT）
  V_design_kn: 19.0 # 设计航速 (kn), PCTC 典型 18-20 kn
  V_design_ms: 9.774 # 设计航速 (m/s) = 19 × 0.5144
  ship_type_imo: "roro_cargo_vehicle"  # IMO 船型 (CII 参考线, cii.py SHIP_TYPE_CII_PARAMS，GT 基数 cap=57700)

wind_resistance:
  A_T: 1300.0       # 横剖面受风面积 (m²), PCTC 高干舷大箱体迎风面显著偏大（估算）
  A_L: 8500.0       # 侧向受风面积 (m²), 侧向巨大平面（估算）
  C_X_head: 0.90    # 顶风阻力系数
  C_X_cross: 1.20   # 横风阻力系数
  C_X_tail: 0.50    # 顺风阻力系数

seawater:
  rho_sw: 1025.0    # 海水密度 (kg/m³)
  nu_sw: 1.19e-6    # 海水运动粘度 (m²/s, 15°C)
