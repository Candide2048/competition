# -*- coding: utf-8 -*-
# 效益矩阵航线定义
# ─────────────────────────────────────────────────────────────
# 所有航路点均落在 ERA5 数据覆盖范围内 (10°S–40°N, 30°E–130°E)。
# 用于 phase_b_matrix.py 构建「航线 × 季节 × 帆型」效益矩阵。
#
# 航线选取原则:
#   - 覆盖不同风况区 (波斯湾弱风 / 印度洋西南季风强风 / 南海东北季风)
#   - 均为真实 VLCC/散货船原油-能源运输走廊 (亚洲进口主干)
#   - 长度差异化 (全程主干 ~6200 nm → 区段 ~1200 nm) 以检验尺度稳健性
#
# 数据来源: 世界主要航运航线参考 + ERA5 覆盖校验
# 更新日期: 2026-07-23

routes:

  middle_east_china:
    name: "中东→中国 (VLCC 原油, 经马六甲)"
    description: "锚定主干航线, 跨波斯湾/阿拉伯海/孟加拉湾/马六甲/南海全风况区"
    cargo: "crude_oil"
    waypoints:
      - [26.7, 50.2]    # Ras Tanura (沙特装货港)
      - [26.5, 56.5]    # 霍尔木兹海峡
      - [23.0, 60.0]    # 阿曼湾
      - [20.0, 64.0]    # 阿拉伯海
      - [14.0, 68.0]    # 阿拉伯海 (印度西海岸外)
      - [10.0, 72.0]    # 印度洋 (印度南端)
      - [8.0, 77.0]     # 印度洋 (斯里兰卡以南)
      - [8.0, 82.0]     # 孟加拉湾
      - [7.0, 88.0]     # 孟加拉湾 (安达曼海)
      - [6.0, 95.0]     # 马六甲海峡西入口
      - [3.0, 100.0]    # 马六甲海峡 (新加坡附近)
      - [5.0, 105.0]    # 南海 (越南以南)
      - [10.0, 110.0]   # 南海 (越南中部外海)
      - [15.0, 114.0]   # 南海 (西沙群岛附近)
      - [20.0, 117.0]   # 南海 (巴士海峡以西)
      - [24.0, 119.0]   # 台湾海峡南口
      - [27.0, 120.5]   # 东中国海 (温州外海)
      - [29.9, 121.9]   # 宁波舟山港 (卸货港)

  arabian_sea:
    name: "霍尔木兹→斯里兰卡 (阿拉伯海区段)"
    description: "阿拉伯海西南季风强风区, 夏季季风 8-14 m/s"
    cargo: "crude_oil"
    waypoints:
      - [26.5, 56.5]    # 霍尔木兹海峡
      - [23.0, 60.0]    # 阿曼湾
      - [18.0, 64.0]    # 阿拉伯海中部
      - [13.0, 70.0]    # 阿拉伯海南部
      - [8.0, 77.0]     # 斯里兰卡以南

  bay_of_bengal:
    name: "斯里兰卡→马六甲 (孟加拉湾区段)"
    description: "孟加拉湾季风过渡区, 风向季节反转显著"
    cargo: "crude_oil"
    waypoints:
      - [8.0, 77.0]     # 斯里兰卡以南
      - [8.0, 82.0]     # 孟加拉湾
      - [7.0, 88.0]     # 安达曼海
      - [6.0, 95.0]     # 马六甲海峡西入口
      - [3.0, 100.0]    # 新加坡附近

  south_china_sea:
    name: "新加坡→宁波 (南海区段)"
    description: "南海东北季风区, 冬季强风 (10-15 m/s), 夏季弱"
    cargo: "crude_oil"
    waypoints:
      - [3.0, 100.0]    # 新加坡附近
      - [5.0, 105.0]    # 南海 (越南以南)
      - [10.0, 110.0]   # 南海 (越南中部外海)
      - [15.0, 114.0]   # 南海 (西沙群岛附近)
      - [20.0, 117.0]   # 南海 (巴士海峡以西)
      - [24.0, 119.0]   # 台湾海峡南口
      - [29.9, 121.9]   # 宁波舟山港

  indian_ocean_monsoon:
    name: "阿拉伯海→苏门答腊 (赤道季风带)"
    description: "低纬赤道季风带 (5-10°N), 西南季风期风能资源最丰"
    cargo: "iron_ore"
    waypoints:
      - [12.0, 60.0]    # 阿拉伯海南部
      - [9.0, 68.0]     # 印度洋 (拉克沙群岛外)
      - [6.0, 78.0]     # 印度洋赤道带
      - [5.0, 88.0]     # 孟加拉湾南缘
      - [4.0, 96.0]     # 苏门答腊西北外海

# ─────────────────────────────────────────────────────────────
# 季节情景 (2025 全年 ERA5)
# 每个季节取月中作为代表性出发日期
# ─────────────────────────────────────────────────────────────
seasons:
  winter: "2025-01-15T00:00"   # 东北季风盛期 (南海强风)
  spring: "2025-04-15T00:00"   # 季风过渡期
  summer: "2025-07-15T00:00"   # 西南季风盛期 (阿拉伯海/印度洋强风)
  autumn: "2025-10-15T00:00"   # 季风过渡期
