# Keep the Render free instance awake by pinging it every 10 minutes.
# GitHub may delay scheduled workflows, and disables schedules after 60 days
# without repository activity.
name: Keep Render Awake

on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch: {}

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Ping wasp-dashboard
        shell: bash
        run: |
          code=$(curl -sS -o /dev/null -w "%{http_code}" --max-time 90 --retry 2 --retry-delay 15 https://competition-dugx.onrender.com/)
          echo "HTTP status: $code"
          if [[ ! "$code" =~ ^[23][0-9]{2}$ ]]; then
            echo "Service health check failed with HTTP $code"
            exit 1
          fi
